<!doctype html>
<html lang="{{REPORT_LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{REPORT_TITLE}}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fafaf9; color: #17202a; font: 1rem/1.7 system-ui, sans-serif; }
      main { max-width: 68rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); overflow-wrap: anywhere; }
      header { margin-bottom: 2.5rem; }
      h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
      h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); }
      h2 { margin-top: 2.5rem; font-size: 1.5rem; }
      h3 { font-size: 1.15rem; }
      p, ul, ol { max-width: 75ch; }
      li + li { margin-top: .4rem; }
      a { color: #174b80; text-underline-offset: .2em; }
      :focus-visible { outline: 3px solid #174b80; outline-offset: 3px; }
      .meta, figcaption { color: #52606d; font-size: .9rem; }
      .lead { font-size: 1.15rem; }
      .callout, article { margin-block: 1.5rem; padding: 1.25rem; border: 1px solid #cbd5e1; background: #fff; }
      .comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1.5rem; }
      .comparison > * { min-width: 0; }
      figure { margin: 1rem 0; min-width: 0; }
      img, svg { display: block; max-width: 100%; height: auto; }
      .table-wrap { max-width: 100%; overflow-x: auto; margin-block: 1.5rem; }
      table { width: 100%; border-collapse: collapse; }
      caption { text-align: left; font-weight: 600; margin-bottom: .5rem; }
      th, td { padding: .75rem; border-bottom: 1px solid #cbd5e1; text-align: left; vertical-align: top; }
      th { background: #eef2f6; }
      pre { overflow-x: auto; padding: 1rem; background: #eef2f6; }
      code { font-family: ui-monospace, monospace; font-size: .9em; }
      details { margin-block: 1rem; padding: .75rem 1rem; border: 1px solid #cbd5e1; background: #fff; }
      summary { cursor: pointer; font-weight: 600; }
      details[open] > summary { margin-bottom: .75rem; }
      blockquote { margin-inline: 0; padding-left: 1rem; border-left: 3px solid #64748b; }
      footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #cbd5e1; }
      @media print {
        body { background: #fff; color: #000; font-size: 10pt; }
        main { max-width: none; padding: 0; }
        h1, h2, h3, summary { break-after: avoid; }
        figure, tr { break-inside: avoid; }
        .comparison { display: block; }
        .table-wrap, pre { overflow: visible; }
        pre { white-space: pre-wrap; }
        details::details-content { content-visibility: visible; }
        details > :not(summary) { display: block; }
        a { color: inherit; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- REPORT_CONTENT -->
    </main>
  </body>
</html>
